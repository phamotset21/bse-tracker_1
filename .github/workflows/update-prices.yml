name: Update Stock Prices & News

permissions:
  contents: write

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch:

jobs:
  update-prices-and-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. FETCH PRICES
      - name: Fetch Prices from Mansa API
        env:
          MANSA_API_KEY: ${{ secrets.MANSA_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import os

          api_key = os.environ.get('MANSA_API_KEY', '')
          url = "https://mansaapi.com/api/v1/markets/exchanges/BSE/stocks?limit=200"
          req = urllib.request.Request(url, headers={
              'Authorization': f'Bearer {api_key}',
              'Accept': 'application/json',
              'User-Agent': 'Mozilla/5.0'
          })

          try:
              with urllib.request.urlopen(req) as response:
                  result = json.loads(response.read().decode('utf-8'))
                  stocks_data = result.get('data', [])
                  prices = {s.get('ticker'): s.get('price') for s in stocks_data if s.get('ticker') and s.get('price') is not None}
                  with open('prices.json', 'w') as f:
                      json.dump(prices, f, indent=2)
                  print(f"Updated {len(prices)} prices.")
          except Exception as e:
              print(f"Price Error: {e}")
          PY

      # 2. FETCH BSE COMPANY DISCLOSURES & DIRECT PDFs
      - name: Scrape BSE Announcements & PDFs
        run: |
          pip install beautifulsoup4 requests
          python - <<'PY'
          import json, re, sys, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          URL = "https://www.bse.co.bw/companydisclosures/"
          H = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}

          # logo file ID -> ticker (add more as they show up in the log)
          LOGO_MAP = {"222": "LETSHEGO", "358": "FPC", "400": "TLOU"}

          # fallback: keyword in the title -> ticker
          KEYWORDS = {
              "LETSHEGO": "LETSHEGO", "TLOU": "TLOU", "FNBB": "FNBB",
              "ABSA": "ABSA", "BTCL": "BTCL", "TURNSTAR": "TURNSTAR",
              "SECHABA": "SECHABA", "SEFALANA": "SEFALANA",
              "CHOPPIES": "CHOPPIES", "STANBIC": "STANBIC",
              "BIHL": "BIHL", "ENGEN": "ENGEN", "MINERGY": "MINERGY",
              "LUCARA": "LUC", "INVESTEC": "INVESTEC", "ANGLO": "ANGLO",
          }

          date_re = re.compile(r'(\d{4}-\d{2}-\d{2})\s+(\d{1,2}:\d{2})')

          r = requests.get(URL, headers=H, timeout=20)
          print("Status:", r.status_code)
          soup = BeautifulSoup(r.text, 'html.parser')

          items, seen = [], set()
          for a in soup.find_all('a', href=re.compile(r'/storage/disclosures/', re.I)):
              link = urljoin(URL, a['href'].strip())
              if link in seen:
                  continue
              seen.add(link)

              row = a.find_parent('tr') or a.parent
              m = date_re.search(row.get_text(" ", strip=True))
              if not m:
                  continue

              title = a.get_text(" ", strip=True)
              img = row.find('img')
              logo = re.search(r'/logos/(\d+)\.', img.get('src', '')) if img else None
              logo_id = logo.group(1) if logo else None

              ticker = LOGO_MAP.get(logo_id)
              if not ticker:
                  ticker = next((t for k, t in KEYWORDS.items() if k in title.upper()), "BSE")
                  print(f"Unmapped logo {logo_id} -> '{title}' (guessed {ticker})")

              items.append({
                  "symbol": ticker,
                  "title": title,
                  "link": link,
                  "date": m.group(1),
                  "time": m.group(2),
                  "summary": f"{ticker}: {title}"
              })

          items.sort(key=lambda x: (x['date'], x['time']), reverse=True)

          if not items:
              print("Found 0 announcements. Failing so the old file is not silently kept.")
              sys.exit(1)

          with open('news.json', 'w', encoding='utf-8') as f:
              json.dump(items[:10], f, indent=2, ensure_ascii=False)
          print(f"Saved {len(items[:10])} announcements.")
          PY

      # 3. COMMIT CHANGES
      - name: Commit and Push
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email "action@github.com"
          git add prices.json news.json
          git commit -m "Update stock prices and company disclosures cleanly" || exit 0
          git pull --rebase origin main
          git push
