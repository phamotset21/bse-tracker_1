name: Update Stock Prices & News

permissions:
  contents: write

on:
  push:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch:

jobs:
  update-prices-and-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. FETCH PRICES
      - name: Fetch Prices from Mansa API
        env:
          MANSA_API_KEY: ${{ secrets.MANSA_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import os

          api_key = os.environ.get('MANSA_API_KEY', '')
          url = "https://mansaapi.com/api/v1/markets/exchanges/BSE/stocks?limit=200"
          req = urllib.request.Request(url, headers={
              'Authorization': f'Bearer {api_key}',
              'Accept': 'application/json',
              'User-Agent': 'Mozilla/5.0'
          })

          try:
              with urllib.request.urlopen(req) as response:
                  result = json.loads(response.read().decode('utf-8'))
                  stocks_data = result.get('data', [])
                  prices = {s.get('ticker'): s.get('price') for s in stocks_data if s.get('ticker') and s.get('price') is not None}
                  with open('prices.json', 'w') as f:
                      json.dump(prices, f, indent=2)
                  print(f"Updated {len(prices)} prices.")
          except Exception as e:
              print(f"Price Error: {e}")
          PY

      # 2. FETCH PRECISE COMPANY DISCLOSURES
      - name: Scrape BSE Company Disclosures
        run: |
          pip install beautifulsoup4 requests
          python - <<'PY'
          import json
          import requests
          from bs4 import BeautifulSoup
          import re

          url = "https://www.bse.co.bw/xnews/"
          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}

          valid_companies = {
              "FNBB": "FNBB", "FIRST NATIONAL BANK": "FNBB",
              "ABSA": "ABSA", "BARCLAYS": "ABSA",
              "BTCL": "BTCL", "BOTSWANA TELECOMMUNICATIONS": "BTCL",
              "TURNSTAR": "TURNSTAR", "SECHABA": "SECHABA", "SEFALANA": "SEFALANA",
              "LETSHEGO": "LETSHEGO", "CHOPPIES": "CHOPPIES", "STANBIC": "STANBIC",
              "BIHL": "BIHL", "BOTSWANA INSURANCE": "BIHL", "NAP": "NAP", 
              "NEW AFRICAN PROPERTIES": "NAP", "RDC": "RDCP", "ENGEN": "ENGEN",
              "MINERGY": "MINERGY", "BOTALA": "BOTALA", "SHUMBA": "SHUMBA",
              "TLOU": "TLOU", "TLOU ENERGY": "TLOU", "CHOBE": "CHOBE",
              "CRESTA": "CRESTA", "G4S": "G4S", "LETLOLE": "LETLOLE",
              "PRIMETIME": "PRIMETIME", "ACCESS": "ACCESS", "SEEDCO": "SEEDCO",
              "STANCHART": "STANCHART", "OLYMPIA": "OLYMPIA", "LUCARA": "LUC",
              "INVESTEC": "INVESTEC", "ANGLO": "ANGLO"
          }

          ignored_phrases = [
              "SKIP TO", "MARKET STATS", "MARKET SNAPSHOT", "HOME", 
              "ABOUT US", "CONTACT", "SEARCH", "DATA PRODUCTS", "LISTING FEES"
          ]

          try:
              response = requests.get(url, headers=headers, timeout=15)
              soup = BeautifulSoup(response.text, 'html.parser')
              
              news_items = []
              
              # Target announcement blocks/rows specifically
              for a_tag in soup.find_all('a', href=True):
                  title = a_tag.get_text(" ", strip=True)
                  href = a_tag.get('href', '')

                  if len(title) < 15:
                      continue

                  title_upper = title.upper()

                  # Skip layout elements or menu shortcuts
                  if any(ig in title_upper for ig in ignored_phrases):
                      continue

                  # The link must point to a document upload or specific announcement path
                  if not any(ext in href.lower() for ext in ['.pdf', 'wp-content', 'disclosure', 'announcement', 'xnews', 'communique']):
                      continue

                  parent_text = a_tag.parent.get_text(" ", strip=True).upper() if a_tag.parent else ""
                  combined_context = f"{title_upper} {parent_text}"

                  matched_ticker = None
                  for key, ticker in valid_companies.items():
                      if key in combined_context:
                          matched_ticker = ticker
                          break

                  if not matched_ticker:
                      continue

                  if href.startswith('/'):
                      href = "https://www.bse.co.bw" + href

                  # Look for date format in context text
                  date_match = re.search(r'\d{4}-\d{2}-\d{2}', combined_context)
                  date_str = date_match.group(0) if date_match else "2026-11-13"

                  news_items.append({
                      "symbol": matched_ticker,
                      "title": title,
                      "link": href,
                      "date": date_str,
                      "summary": f"Official verified disclosure document for {matched_ticker}."
                  })

              # Deduplicate by link or title
              unique_news = list({v['link']: v for v in news_items}.values())

              if len(unique_news) > 0:
                  final_news = unique_news[:10]
                  with open('news.json', 'w') as f:
                      json.dump(final_news, f, indent=2)
                  print(f"Successfully scraped {len(final_news)} clean company announcements.")
              else:
                  print("CRITICAL: Found 0 company announcements.")
                  
          except Exception as e:
              print(f"News Error: {e}")
          PY

      # 3. COMMIT CHANGES
      - name: Commit and Push
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email "action@github.com"
          git add prices.json news.json
          git commit -m "Fix news scraping and structural links" || exit 0
          git pull --rebase origin main
          git push
