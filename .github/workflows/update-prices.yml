name: Update Stock Prices

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch Prices
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import re

          url = "https://wallflake.com/exchanges/bse-botswana"
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          html = urllib.request.urlopen(req).read().decode('utf-8')

          pattern = r'\[([A-Z]+).*?\]\(.*?\).*?BWP ([\d\.]+)'
          matches = re.findall(pattern, html)

          prices = {ticker: float(price) for ticker, price in matches}

          if not prices:
              print("No prices found, check the scraper.")
              exit(1)

          with open('prices.json', 'w') as f:
              json.dump(prices, f, indent=2)
          print(f"Updated prices for {len(prices)} tickers.")
          PY

      - name: Commit and Push
        run: |
          git config --global user.name 'GitHub Action'
          git config --local user.email "action@github.com"
          git add prices.json
          git commit -m "Update stock prices" || exit 0
          git push
