name: Update Stock Prices & News

permissions:
  contents: write

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch:

jobs:
  update-prices-and-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. FETCH PRICES
      - name: Fetch Prices from Mansa API
        env:
          MANSA_API_KEY: ${{ secrets.MANSA_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import os

          api_key = os.environ.get('MANSA_API_KEY', '')
          url = "https://mansaapi.com/api/v1/markets/exchanges/BSE/stocks?limit=200"
          req = urllib.request.Request(url, headers={
              'Authorization': f'Bearer {api_key}',
              'Accept': 'application/json',
              'User-Agent': 'Mozilla/5.0'
          })

          try:
              with urllib.request.urlopen(req) as response:
                  result = json.loads(response.read().decode('utf-8'))
                  stocks_data = result.get('data', [])
                  prices = {s.get('ticker'): s.get('price') for s in stocks_data if s.get('ticker') and s.get('price') is not None}
                  with open('prices.json', 'w') as f:
                      json.dump(prices, f, indent=2)
                  print(f"Updated {len(prices)} prices.")
          except Exception as e:
              print(f"Price Error: {e}")
          PY

      # 2. FETCH BSE ANNOUNCEMENTS & DIRECT PDFs
      - name: Scrape BSE Announcements & PDFs
        run: |
          pip install beautifulsoup4 requests
          python - <<'PY'
          import json, re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          URL = "https://www.bse.co.bw/xnews/"
          H = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}

          valid_companies = {
              "LETSHEGO": "LETSHEGO", "TLOU": "TLOU", "FNBB": "FNBB",
              "ABSA": "ABSA", "BTCL": "BTCL", "TURNSTAR": "TURNSTAR",
              "SECHABA": "SECHABA", "SEFALANA": "SEFALANA",
              "CHOPPIES": "CHOPPIES", "STANBIC": "STANBIC",
              "BIHL": "BIHL", "NAP": "NAP", "ENGEN": "ENGEN",
              "MINERGY": "MINERGY", "LUCARA": "LUC", "FPC": "FPC",
              "RDC": "RDCP", "ANGLO": "ANGLO", "INVESTEC": "INVESTEC"
          }

          def find_pdf(page_url):
              try:
                  res = requests.get(page_url, headers=H, timeout=15)
                  s = BeautifulSoup(res.text, 'html.parser')
                  a = s.find('a', href=re.compile(r'\.pdf($|\?)', re.I))
                  return urljoin(page_url, a['href']) if a else page_url
              except Exception:
                  return page_url

          try:
              r = requests.get(URL, headers=H, timeout=20)
              print("Status:", r.status_code, "| cards in HTML:", 'RIGHTS OFFER' in r.text.upper() or 'COMMUNIQUE' in r.text.upper())
              soup = BeautifulSoup(r.text, 'html.parser')
              date_re = re.compile(r'(\d{4}-\d{2}-\d{2})\s+(\d{1,2}:\d{2})')

              items, seen = [], set()
              for node in soup.find_all(string=date_re):
                  m = date_re.search(node)
                  if not m:
                      continue
                  
                  card = node.parent
                  a = None
                  for _ in range(6):  # walk up to find the container card with a valid title link
                      if not card:
                          break
                      a = next((x for x in card.find_all('a', href=True)
                                if len(x.get_text(strip=True)) >= 10 and not any(skip in x.get_text(strip=True).upper() for skip in ['SKIP', 'HOME', 'STATISTICS', 'SNAPSHOT'])), None)
                      if a:
                          break
                      card = card.parent
                  
                  if not a:
                      continue

                  link = urljoin(URL, a['href'].strip())
                  if link in seen or 'bse.co.bw/#fac' in link:
                      continue
                  seen.add(link)

                  title = a.get_text(" ", strip=True)
                  img = card.find('img') if card else None
                  hay = f"{title} {img.get('alt','') if img else ''} {img.get('src','') if img else ''}".upper()
                  
                  ticker = "BSE"
                  for k, t in valid_companies.items():
                      if k in hay or k in title.upper():
                          ticker = t
                          break

                  if not link.lower().endswith('.pdf'):
                      link = find_pdf(link)

                  items.append({
                      "symbol": ticker,
                      "title": title,
                      "link": link,
                      "date": m.group(1),
                      "time": m.group(2),
                      "summary": f"Official verified disclosure announcement for {ticker}."
                  })

              items.sort(key=lambda x: (x['date'], x['time']), reverse=True)
              if items:
                  with open('news.json', 'w') as f:
                      json.dump(items[:10], f, indent=2)
                  print(f"Successfully saved {len(items[:10])} announcements.")
              else:
                  print("Found 0 cards. Keeping existing file structure intact.")
          except Exception as e:
              print(f"News Error: {e}")
          PY

      # 3. COMMIT CHANGES
      - name: Commit and Push
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email "action@github.com"
          git add prices.json news.json
          git commit -m "Update stock prices and verified BSE PDF news" || exit 0
          git pull --rebase origin main
          git push
