name: Update Stock Prices & News

on:
  push:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch: # Allows manual triggers

jobs:
  update-prices-and-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch Data and Push to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MANSA_API_KEY: ${{ secrets.MANSA_API_KEY }}
        run: |
          pip install requests beautifulsoup4
          python - <<'PY'
          import json, os, requests, urllib.request, re
          from bs4 import BeautifulSoup
          from datetime import datetime

          SUPABASE_URL = os.environ['SUPABASE_URL']
          SUPABASE_KEY = os.environ['SUPABASE_KEY']
          MANSA_API_KEY = os.environ['MANSA_API_KEY']

          headers = {
              "apikey": SUPABASE_KEY,
              "Authorization": f"Bearer {SUPABASE_KEY}",
              "Content-Type": "application/json",
              "Prefer": "resolution=merge-duplicates" 
          }

          # ==========================================
          # 1. SYNC PRICES
          # ==========================================
          print("Starting Price Sync...")
          try:
              url = "https://mansaapi.com/api/v1/markets/exchanges/BSE/stocks?limit=200"
              req = urllib.request.Request(url, headers={'Authorization': f'Bearer {MANSA_API_KEY}', 'Accept': 'application/json', 'User-Agent': 'Mozilla/5.0'})
              
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode('utf-8')).get('data', [])
                  payload = []
                  for s in data:
                      if s.get('ticker') and s.get('price') is not None:
                          payload.append({
                              "ticker": s['ticker'],
                              "company_name": s.get('name', s['ticker']),
                              "current_price": float(s['price'])
                          })
                  
                  if payload:
                      r = requests.post(f"{SUPABASE_URL}/rest/v1/bse_tickers?on_conflict=ticker", headers=headers, json=payload)
                      print(f"Supabase Prices Push Status: {r.status_code}")
          except Exception as e:
              print("Price Sync Error:", e)

          # ==========================================
          # 2. SYNC NEWS (Targeting X-News)
          # ==========================================
          print("\nStarting News Sync...")
          
          ticker_map = {
              "FNBB": "FNBB", "FIRST NATIONAL BANK": "FNBB",
              "ABSA": "ABSA", "BARCLAYS": "ABSA",
              "BTCL": "BTCL", "BOTSWANA TELECOMMUNICATIONS": "BTCL",
              "TURNSTAR": "TURNSTAR", "SECHABA": "SECHABA", "SEFALANA": "SEFALANA",
              "LETSHEGO": "LETSHEGO", "CHOPPIES": "CHOPPIES", "STANBIC": "STANBIC",
              "BIHL": "BIHL", "BOTSWANA INSURANCE": "BIHL", "NAP": "NAP", 
              "NEW AFRICAN PROPERTIES": "NAP", "RDC": "RDCP", "RDC PROPERTIES": "RDCP",
              "ENGEN": "ENGEN", "MINERGY": "MINERGY", "BOTALA": "BOTALA", "SHUMBA": "SHUMBA",
              "TLOU": "TLOU", "TLOU ENERGY": "TLOU", "CHOBE": "CHOBE", "CHOBE HOLDINGS": "CHOBE", 
              "CRESTA": "CRESTA", "G4S": "G4S", "LETLOLE": "LETLOLE", "PRIMETIME": "PRIMETIME", 
              "ACCESS": "ACCESS", "ACCESS BANK": "ACCESS", "SEEDCO": "SEEDCO", 
              "STANCHART": "STANCHART", "STANDARD CHARTERED": "STANCHART",
              "OLYMPIA": "OLYMPIA", "LUCARA": "LUC", "INVESTEC": "INVESTEC", "ANGLO": "ANGLO",
              "CA SALES": "CA SALES", "GAIA": "GAIA"
          }

          try:
              # Use the specific X-News URL
              res = requests.get("https://www.bse.co.bw/xnews/", headers={'User-Agent': 'Mozilla/5.0'})
              soup = BeautifulSoup(res.text, 'html.parser')
              
              news_payload = []
              
              # Junk keywords to ignore (Footer links)
              junk_keywords = ["customer feedback", "complaints form", "daily market report", "customer complaints"]
              
              for link in soup.find_all('a'):
                  title = link.get_text(" ", strip=True)
                  href = link.get('href', '')
                  
                  # Must be a real headline, not in junk list, and contain a valid link
                  if len(title) > 15 and not any(junk in title.lower() for junk in junk_keywords):
                      if '.pdf' in href.lower() or 'disclosure' in href.lower() or 'storage' in href.lower() or 'xnews' in href.lower():
                          
                          container = link.find_parent('tr') or link.find_parent('li') or link.find_parent('div', class_=re.compile('row|item|list'))
                          if not container: container = link.parent.parent if link.parent else link
                              
                          container_text = container.get_text(" ", strip=True) if container else ""
                          
                          date_match = re.search(r'(\d{4}-\d{2}-\d{2})', container_text)
                          date_str = date_match.group(1) if date_match else datetime.today().strftime('%Y-%m-%d')
                          
                          combined_text = title.upper() + " " + container_text.upper()
                          if container:
                              for img in container.find_all('img'):
                                  alt = img.get('alt')
                                  if alt: combined_text += " " + alt.upper()
                                  
                          ticker = "BSE"
                          for key, sym in ticker_map.items():
                              if key in combined_text:
                                  ticker = sym
                                  break
                                  
                          if href.startswith('/'): href = "https://www.bse.co.bw" + href
                              
                          news_payload.append({
                              "ticker": ticker,
                              "published_at": date_str + "T00:00:00Z",
                              "raw_headline": title,
                              "pdf_url": href
                          })
              
              unique_news = list({v['pdf_url']:v for v in news_payload}.values())
              
              if unique_news:
                  r = requests.post(f"{SUPABASE_URL}/rest/v1/xnews_disclosures?on_conflict=pdf_url", headers=headers, json=unique_news)
                  print(f"Supabase News Push Status: {r.status_code}")
                  print(f"Found {len(unique_news)} news items.")
                  
                  unique_news.sort(key=lambda x: x['published_at'], reverse=True)
                  for n in unique_news[:3]: 
                      print(f"- {n['published_at'][:10]} | {n['ticker']} | {n['raw_headline']}")
              else:
                  print("No valid news links found on the page.")
                  
          except Exception as e:
              print("News Sync Error:", e)
          PY
