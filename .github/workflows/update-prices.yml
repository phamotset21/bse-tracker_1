name: Update Stock Prices

on:
  push:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Prices from Mansa API
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import os

          # Use the API key from GitHub Secrets
          api_key = os.environ['MANSA_API_KEY']
          url = "https://api.mansaapi.com/v1/markets/BSE/stocks" # BSE endpoint

          req = urllib.request.Request(url, headers={
              'Authorization': f'Bearer {api_key}',
              'User-Agent': 'Mozilla/5.0'
          })

          try:
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode('utf-8'))
                  
                  prices = {}
                  # Adjust based on the actual API response structure
                  for stock in data.get('stocks', []):
                      prices[stock['symbol']] = stock['price']
                  
                  if not prices:
                      print("No prices found in API response.")
                      exit(1)

                  with open('prices.json', 'w') as f:
                      json.dump(prices, f, indent=2)
                  print(f"Successfully updated {len(prices)} prices.")
          except Exception as e:
              print(f"API request failed: {e}")
              exit(1)
          PY
        env:
          MANSA_API_KEY: ${{ secrets.MANSA_API_KEY }}

      - name: Commit and Push
        run: |
          git config --global user.name 'GitHub Action'
          git config --local user.email "action@github.com"
          git add prices.json
          git commit -m "Update stock prices" || exit 0
          git push
