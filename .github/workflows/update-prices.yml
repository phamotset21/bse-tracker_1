name: Update Stock Prices & News

on:
  push:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch: # Allows manual triggers

jobs:
  update-prices-and-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests playwright
          playwright install chromium
          playwright install-deps

      - name: Fetch Data and Push to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MANSA_API_KEY: ${{ secrets.MANSA_API_KEY }}
        run: |
          python - <<'PY'
          import os, re, sys, requests
          from playwright.sync_api import sync_playwright

          SUPABASE_URL = os.environ['SUPABASE_URL']
          SUPABASE_KEY = os.environ['SUPABASE_KEY']
          MANSA_API_KEY = os.environ['MANSA_API_KEY']

          headers = {
              "apikey": SUPABASE_KEY,
              "Authorization": f"Bearer {SUPABASE_KEY}",
              "Content-Type": "application/json",
              "Prefer": "resolution=merge-duplicates"
          }

          errors = []
          valid_tickers = {"BSE"}

          # ==========================================
          # 1. SYNC PRICES
          # ==========================================
          print("Starting Price Sync...")
          try:
              url = "https://mansaapi.com/api/v1/markets/exchanges/BSE/stocks?limit=200"
              req = requests.get(
                  url,
                  headers={
                      'Authorization': f'Bearer {MANSA_API_KEY}',
                      'Accept': 'application/json',
                      'User-Agent': 'Mozilla/5.0'
                  },
                  timeout=20
              )
              req.raise_for_status()
              data = req.json().get('data', [])

              payload = []
              for s in data:
                  if s.get('ticker') and s.get('price') is not None:
                      sym = s['ticker'].strip().upper()
                      valid_tickers.add(sym)
                      payload.append({
                          "ticker": sym,
                          "company_name": s.get('name', s['ticker']).strip(),
                          "current_price": float(s['price'])
                      })

              if payload:
                  r = requests.post(
                      f"{SUPABASE_URL}/rest/v1/bse_tickers?on_conflict=ticker",
                      headers=headers,
                      json=payload,
                      timeout=20
                  )
                  if not r.ok:
                      print("Supabase Prices error body:", r.text)
                  r.raise_for_status()
                  print(f"Supabase Prices Push Status: {r.status_code} ({len(payload)} tickers)")
              else:
                  print("Warning: Mansa API returned no stock items.")
          except Exception as e:
              print("Price Sync Error:", e)
              errors.append(f"Prices: {e}")

          # Fetch existing tickers from Supabase so foreign keys never fail
          try:
              t_resp = requests.get(
                  f"{SUPABASE_URL}/rest/v1/bse_tickers?select=ticker",
                  headers={"apikey": SUPABASE_KEY, "Authorization": f"Bearer {SUPABASE_KEY}"},
                  timeout=15
              )
              if t_resp.ok:
                  for row in t_resp.json():
                      if row.get("ticker"):
                          valid_tickers.add(row["ticker"].strip().upper())
          except Exception as e:
              print("Warning: could not fetch valid_tickers:", e)

          # ==========================================
          # 2. SYNC NEWS
          # ==========================================
          print("\nStarting News Sync...")

          ticker_map = {
              "FNBB": "FNBB", "FIRST NATIONAL BANK": "FNBB",
              "ABSA": "ABSA", "BARCLAYS": "ABSA",
              "BTCL": "BTCL", "BOTSWANA TELECOMMUNICATIONS": "BTCL",
              "TURNSTAR": "TURNSTAR", "SECHABA": "SECHABA", "SEFALANA": "SEFALANA",
              "LETSHEGO": "LETSHEGO", "CHOPPIES": "CHOPPIES", "STANBIC": "STANBIC",
              "BIHL": "BIHL", "BOTSWANA INSURANCE": "BIHL", "NAP": "NAP",
              "NEW AFRICAN PROPERTIES": "NAP", "RDC": "RDCP", "RDC PROPERTIES": "RDCP",
              "ENGEN": "ENGEN", "MINERGY": "MINERGY", "BOTALA": "BOTALA", "SHUMBA": "SHUMBA",
              "TLOU": "TLOU", "TLOU ENERGY": "TLOU", "CHOBE": "CHOBE", "CHOBE HOLDINGS": "CHOBE",
              "CRESTA": "CRESTA", "G4S": "G4S", "LETLOLE": "LETLOLE", "PRIMETIME": "PRIMETIME",
              "ACCESS": "ACCESS", "ACCESS BANK": "ACCESS", "SEEDCO": "SEEDCO",
              "STANCHART": "STANCHART", "STANDARD CHARTERED": "STANCHART",
              "OLYMPIA": "OLYMPIA", "LUCARA": "LUC", "INVESTEC": "INVESTEC", "ANGLO": "ANGLO",
              "CA SALES": "CA SALES", "GAIA": "GAIA"
          }

          target_urls = [
              "https://www.bse.co.bw/company-disclosures/",
              "https://www.bse.co.bw/xnews/"
          ]

          try:
              news_items = []
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  page = browser.new_page()
                  page.set_default_timeout(30000)

                  for target_url in target_urls:
                      try:
                          print(f"Checking {target_url}...")
                          page.goto(target_url, wait_until="domcontentloaded")
                          page.wait_for_selector(r'text=/\d{4}-\d{2}-\d{2}/', timeout=20000)

                          extracted = page.evaluate("""
                              () => {
                                  const results = [];
                                  const links = document.querySelectorAll('a');
                                  const junkKeywords = ['customer feedback', 'complaints form', 'daily market report', 'data products', 'application form'];

                                  links.forEach(link => {
                                      const text = link.innerText.trim().replace(/\\s+/g, ' ');
                                      const href = link.href;

                                      if (text.length > 15 && !junkKeywords.some(k => text.toLowerCase().includes(k))) {
                                          if (href.includes('disclosure') || href.includes('.pdf') || href.includes('storage') || href.includes('xnews')) {
                                              let container = link.closest('tr') || link.closest('li') || link.closest('article') || link.parentElement?.parentElement;
                                              if (container) {
                                                  const rowText = container.innerText || '';
                                                  const dateMatch = rowText.match(/\\d{4}-\\d{2}-\\d{2}/);
                                                  if (dateMatch) {
                                                      results.push({
                                                          title: text,
                                                          link: href,
                                                          date: dateMatch[0],
                                                          combined_text: text + ' ' + rowText
                                                      });
                                                  }
                                              }
                                          }
                                      }
                                  });
                                  return results;
                              }
                          """)
                          if extracted:
                              news_items.extend(extracted)
                              break
                      except Exception as inner_err:
                          print(f"Could not scrape {target_url}: {inner_err}")

                  browser.close()

              deduped = {}
              for item in news_items:
                  pdf_url = (item.get('link') or '').strip()
                  if not pdf_url:
                      continue

                  ticker = "BSE"
                  combined = item['combined_text'].upper()
                  for key, sym in ticker_map.items():
                      if re.search(rf'\b{re.escape(key)}\b', combined):
                          ticker = sym
                          break

                  safe_ticker = ticker if ticker in valid_tickers else "BSE"

                  deduped[pdf_url] = {
                      "ticker": safe_ticker,
                      "published_at": item['date'] + "T00:00:00Z",
                      "raw_headline": item['title'],
                      "pdf_url": pdf_url
                  }

              unique_news = list(deduped.values())

              if unique_news:
                  r = requests.post(
                      f"{SUPABASE_URL}/rest/v1/xnews_disclosures?on_conflict=pdf_url",
                      headers=headers,
                      json=unique_news,
                      timeout=20
                  )
                  if not r.ok:
                      print("Supabase News error body:", r.text)
                  r.raise_for_status()
                  print(f"Supabase News Push Status: {r.status_code}")
                  print(f"Found {len(unique_news)} unique news items.")

                  unique_news.sort(key=lambda x: x['published_at'], reverse=True)
                  for n in unique_news[:5]:
                      print(f"- {n['published_at'][:10]} | {n['ticker']} | {n['raw_headline']}")
              else:
                  print("Warning: No news items found after rendering JS.")

          except Exception as e:
              print("News Sync Error:", e)
              errors.append(f"News: {e}")

          if errors:
              print("\nCompleted with errors:", errors)
              sys.exit(1)
          PY
