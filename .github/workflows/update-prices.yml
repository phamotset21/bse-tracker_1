name: Update Stock Prices & News

permissions:
  contents: write

on:
  push:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch:

jobs:
  update-prices-and-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. FETCH PRICES (Mansa API)
      - name: Fetch Prices from Mansa API
        env:
          MANSA_API_KEY: ${{ secrets.MANSA_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import os

          api_key = os.environ.get('MANSA_API_KEY', '')
          url = "https://mansaapi.com/api/v1/markets/exchanges/BSE/stocks?limit=200"
          req = urllib.request.Request(url, headers={
              'Authorization': f'Bearer {api_key}',
              'Accept': 'application/json',
              'User-Agent': 'Mozilla/5.0'
          })

          try:
              with urllib.request.urlopen(req) as response:
                  result = json.loads(response.read().decode('utf-8'))
                  stocks_data = result.get('data', [])
                  prices = {s.get('ticker'): s.get('price') for s in stocks_data if s.get('ticker') and s.get('price') is not None}
                  with open('prices.json', 'w') as f:
                      json.dump(prices, f, indent=2)
                  print(f"Updated {len(prices)} prices.")
          except Exception as e:
              print(f"Price Error: {e}")
          PY

      # 2. FETCH NEWS (BeautifulSoup Scraper)
      - name: Scrape BSE News
        run: |
          pip install beautifulsoup4 requests
          python - <<'PY'
          import json
          import requests
          from bs4 import BeautifulSoup
          import re

          url = "https://www.bse.co.bw/xnews/"
          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}

          try:
              response = requests.get(url, headers=headers, timeout=15)
              soup = BeautifulSoup(response.text, 'html.parser')
              
              news_items = []
              
              # Find all links on the page
              links = soup.find_all('a')
              for link in links:
                  title = link.get_text(strip=True)
                  # Filter out short links (navigation, etc.)
                  if len(title) > 15 and "X-News" not in title:
                      # Try to find the date nearby in the parent element
                      parent_text = link.parent.get_text()
                      date_match = re.search(r'(\d{4}-\d{2}-\d{2})', parent_text)
                      date_str = date_match.group(1) if date_match else "2026-11-11" # Fallback
                      
                      # Guess the ticker
                      ticker = "BSE"
                      upper_title = title.upper()
                      for sym in ["FNBB", "ABSA", "BTCL", "TURNSTAR", "SECHABA", "SEFALANA", "LETSHEGO", "CHOPPIES", "STANBIC", "BIHL", "NAP", "RDC", "ENGEN", "MINERGY", "BOTALA", "SHUMBA", "TLOU", "CHOBE", "CRESTA", "G4S", "LETLOLE", "PRIMETIME", "ACCESS"]:
                          if sym in upper_title:
                              ticker = sym
                              break
                              
                      news_items.append({
                          "symbol": ticker,
                          "title": title,
                          "date": date_str,
                          "summary": "Click to view full disclosure on the BSE website."
                      })

              # Remove duplicates
              unique_news = list({v['title']:v for v in news_items}.values())

              if len(unique_news) > 0:
                  # Keep only the top 15
                  final_news = unique_news[:15]
                  with open('news.json', 'w') as f:
                      json.dump(final_news, f, indent=2)
                  print(f"Successfully scraped {len(final_news)} news items.")
              else:
                  print("No news found. The site structure might have changed.")
                  
          except Exception as e:
              print(f"News Error: {e}")
          PY

      # 3. COMMIT CHANGES
      - name: Commit and Push
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email "action@github.com"
          git add prices.json news.json
          git commit -m "Update prices and news" || exit 0
          git pull --rebase origin main
          git push
