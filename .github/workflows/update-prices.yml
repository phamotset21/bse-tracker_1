name: Update Stock Prices & News

permissions:
  contents: write

on:
  push:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch:

jobs:
  update-prices-and-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. FETCH PRICES
      - name: Fetch Prices from Mansa API
        env:
          MANSA_API_KEY: ${{ secrets.MANSA_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import os

          api_key = os.environ.get('MANSA_API_KEY', '')
          url = "https://mansaapi.com/api/v1/markets/exchanges/BSE/stocks?limit=200"
          req = urllib.request.Request(url, headers={
              'Authorization': f'Bearer {api_key}',
              'Accept': 'application/json',
              'User-Agent': 'Mozilla/5.0'
          })

          try:
              with urllib.request.urlopen(req) as response:
                  result = json.loads(response.read().decode('utf-8'))
                  stocks_data = result.get('data', [])
                  prices = {s.get('ticker'): s.get('price') for s in stocks_data if s.get('ticker') and s.get('price') is not None}
                  with open('prices.json', 'w') as f:
                      json.dump(prices, f, indent=2)
                  print(f"Updated {len(prices)} prices.")
          except Exception as e:
              print(f"Price Error: {e}")
          PY

      # 2. FETCH NEWS (Strict Company Match)
      - name: Scrape BSE News
        run: |
          pip install beautifulsoup4 requests
          python - <<'PY'
          import json
          import requests
          from bs4 import BeautifulSoup
          import re

          url = "https://www.bse.co.bw/xnews/"
          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}

          # List of companies we actually care about
          valid_companies = {
              "FNBB": "FNBB", "FIRST NATIONAL BANK": "FNBB",
              "ABSA": "ABSA", "BARCLAYS": "ABSA",
              "BTCL": "BTCL", "BOTSWANA TELECOMMUNICATIONS": "BTCL",
              "TURNSTAR": "TURNSTAR",
              "SECHABA": "SECHABA",
              "SEFALANA": "SEFALANA",
              "LETSHEGO": "LETSHEGO",
              "CHOPPIES": "CHOPPIES",
              "STANBIC": "STANBIC",
              "BIHL": "BIHL", "BOTSWANA INSURANCE": "BIHL",
              "NAP": "NAP", "NEW AFRICAN PROPERTIES": "NAP",
              "RDC": "RDCP", "RDC PROPERTIES": "RDCP",
              "ENGEN": "ENGEN",
              "MINERGY": "MINERGY",
              "BOTALA": "BOTALA",
              "SHUMBA": "SHUMBA",
              "TLOU": "TLOU", "TLOU ENERGY": "TLOU",
              "CHOBE": "CHOBE",
              "CRESTA": "CRESTA",
              "G4S": "G4S",
              "LETLOLE": "LETLOLE",
              "PRIMETIME": "PRIMETIME",
              "ACCESS": "ACCESS", "ACCESS BANK": "ACCESS",
              "SEEDCO": "SEEDCO",
              "STANCHART": "STANCHART", "STANDARD CHARTERED": "STANCHART",
              "OLYMPIA": "OLYMPIA",
              "LUCARA": "LUC",
              "INVESTEC": "INVESTEC",
              "ANGLO": "ANGLO"
          }

          try:
              response = requests.get(url, headers=headers, timeout=15)
              soup = BeautifulSoup(response.text, 'html.parser')
              
              news_items = []
              
              # Look for the EXACT BSE date format
              date_pattern = re.compile(r'\d{4}-\d{2}-\d{2} \d{2}:\d{2} [AP]M GMT\+2')
              date_elements = soup.find_all(string=date_pattern)

              for date_el in date_elements:
                  # Find the container holding the date
                  container = date_el.parent
                  for _ in range(3):
                      if not container: break
                      link_tag = container.find('a')
                      if link_tag: break
                      container = container.parent
                      
                  if link_tag:
                      title = link_tag.get_text(" ", strip=True)
                      href = link_tag.get('href', '#')
                      
                      if len(title) < 10: continue

                      # THE FIX: Only keep it if the title contains a valid company
                      matched_ticker = None
                      upper_title = title.upper()
                      
                      for key, ticker in valid_companies.items():
                          if key in upper_title:
                              matched_ticker = ticker
                              break
                              
                      # If we didn't find a company name, skip it completely!
                      if not matched_ticker:
                          continue

                      # Make absolute URL
                      if href.startswith('/'):
                          href = "https://www.bse.co.bw" + href
                              
                      date_str = date_el.strip()[:10]

                      news_items.append({
                          "symbol": matched_ticker,
                          "title": title,
                          "link": href,
                          "date": date_str,
                          "summary": "Click to view the official BSE disclosure document."
                      })

              # Remove duplicates
              unique_news = list({v['title']:v for v in news_items}.values())

              if len(unique_news) > 0:
                  final_news = unique_news[:10]
                  with open('news.json', 'w') as f:
                      json.dump(final_news, f, indent=2)
                  print(f"Successfully scraped {len(final_news)} news items.")
                  for n in final_news:
                      print(f"- {n['date']} | {n['symbol']} | {n['title']}")
              else:
                  print("CRITICAL: Found 0 valid company news items.")
                  
          except Exception as e:
              print(f"News Error: {e}")
          PY

      # 3. COMMIT CHANGES
      - name: Commit and Push
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email "action@github.com"
          git add prices.json news.json
          git commit -m "Update prices and news" || exit 0
          git pull --rebase origin main
          git push
