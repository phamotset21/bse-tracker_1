name: Update Stock Prices

on:
  push:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Prices from Mansa API
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.error
          import os

          api_key = os.environ['MANSA_API_KEY']
          # Corrected endpoint according to Mansa API docs
          url = "https://mansaapi.com/api/v1/markets/exchanges/BSE/stocks?limit=200"

          req = urllib.request.Request(url, headers={
              'Authorization': f'Bearer {api_key}',
              'User-Agent': 'Mozilla/5.0'
          })

          try:
              with urllib.request.urlopen(req) as response:
                  result = json.loads(response.read().decode('utf-8'))
                  
                  # The API returns data inside a "data" array
                  stocks_data = result.get('data', [])
                  
                  if not stocks_data:
                      print("No prices found in API response.")
                      print(result) # Print raw response for debugging
                      exit(1)

                  prices = {}
                  for stock in stocks_data:
                      # The field is called 'ticker', not 'symbol'
                      ticker = stock.get('ticker')
                      price = stock.get('price')
                      if ticker and price is not None:
                          prices[ticker] = price

                  with open('prices.json', 'w') as f:
                      json.dump(prices, f, indent=2)
                  print(f"Successfully updated {len(prices)} prices.")
          except urllib.error.HTTPError as e:
              print(f"HTTP Error: {e.code} - {e.reason}")
              print(e.read().decode('utf-8')) # Show error details
              exit(1)
          except Exception as e:
              print(f"API request failed: {e}")
              exit(1)
          PY
        env:
          MANSA_API_KEY: ${{ secrets.MANSA_API_KEY }}

      - name: Commit and Push
        run: |
          git config --global user.name 'GitHub Action'
          git config --local user.email "action@github.com"
          git add prices.json
          git commit -m "Update stock prices" || exit 0
          git push
