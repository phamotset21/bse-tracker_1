name: Update Stock Prices & News

permissions:
  contents: write

on:
  push:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch:

jobs:
  update-prices-and-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. FETCH PRICES (Mansa API)
      - name: Fetch Prices from Mansa API
        env:
          MANSA_API_KEY: ${{ secrets.MANSA_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.error
          import os

          api_key = os.environ.get('MANSA_API_KEY', '')
          if not api_key:
              print("ERROR: MANSA_API_KEY secret is empty.")
              exit(1)
              
          url = "https://mansaapi.com/api/v1/markets/exchanges/BSE/stocks?limit=200"
          req = urllib.request.Request(url, headers={
              'Authorization': f'Bearer {api_key}',
              'Accept': 'application/json',
              'User-Agent': 'Mozilla/5.0'
          })

          try:
              with urllib.request.urlopen(req) as response:
                  result = json.loads(response.read().decode('utf-8'))
                  stocks_data = result.get('data', [])
                  
                  if not stocks_data:
                      print("API returned success but 0 stocks found.")
                      exit(1)

                  prices = {}
                  for stock in stocks_data:
                      ticker = stock.get('ticker')
                      price = stock.get('price')
                      if ticker and price is not None:
                          prices[ticker] = price

                  with open('prices.json', 'w') as f:
                      json.dump(prices, f, indent=2)
                  print(f"Successfully updated {len(prices)} prices.")
          except Exception as e:
              print(f"Error: {e}")
              exit(1)
          PY

      # 2. FETCH NEWS (Scrape BSE Website)
      - name: Scrape BSE News
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.error
          from html.parser import HTMLParser
          import re
          from datetime import datetime

          url = "https://www.bse.co.bw/company-disclosures/"
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'})

          try:
              with urllib.request.urlopen(req) as response:
                  html = response.read().decode('utf-8')
                  
              # Basic text extraction and parsing
              # Since BSE's HTML structure can change, we use regex to find dates and links
              # The page usually lists disclosures in a table or list format
              news_items = []
              
              # Find links that point to disclosures (PDFs or pages) with dates
              # Example pattern: <a href="/company-disclosures/...">Title</a> ... 2024-11-08
              pattern = r'<a[^>]+href="([^"]*company-disclosures[^"]*)"[^>]*>(.*?)</a>.*?(\d{4}-\d{2}-\d{2})'
              matches = re.findall(pattern, html, re.DOTALL | re.IGNORECASE)

              for match in matches[:15]:  # Get top 15 latest news
                  link = match[0]
                  title = re.sub('<[^>]+>', '', match[1]).strip()  # Strip any inner HTML tags
                  date_str = match[2]

                  if title and date_str:
                      # Try to guess the ticker from the title or link
                      ticker = "BSE"
                      upper_title = title.upper()
                      for sym in ["FNBB", "ABSA", "BTCL", "TURNSTAR", "SECHABA", "SEFALANA", "LETSHEGO", "CHOPPIES", "STANBIC", "BIHL", "NAP", "RDC", "ENGEN"]:
                          if sym in upper_title:
                              ticker = sym
                              break
                      
                      news_items.append({
                          "symbol": ticker,
                          "title": title,
                          "date": date_str,
                          "summary": "Click to view full disclosure on the BSE website."
                      })

              if not news_items:
                  # Fallback if regex fails (site structure changed)
                  print("Warning: Could not parse BSE news. Keeping existing news.json.")
                  exit(0)

              # Remove duplicates and sort by date
              unique_news = list({v['title']:v for v in news_items}.values())
              unique_news.sort(key=lambda x: x['date'], reverse=True)

              with open('news.json', 'w') as f:
                  json.dump(unique_news, f, indent=2)
                  
              print(f"Successfully scraped {len(unique_news)} news items.")
              
          except Exception as e:
              print(f"Error scraping news: {e}")
              exit(1)
          PY

      # 3. COMMIT CHANGES
      - name: Commit and Push
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email "action@github.com"
          git add prices.json news.json
          git commit -m "Update prices and news" || exit 0
          git pull --rebase origin main
          git push
