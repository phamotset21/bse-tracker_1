name: Update Stock Prices & News

permissions:
  contents: write

on:
  push:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch:

jobs:
  update-prices-and-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. FETCH PRICES
      - name: Fetch Prices from Mansa API
        env:
          MANSA_API_KEY: ${{ secrets.MANSA_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import os

          api_key = os.environ.get('MANSA_API_KEY', '')
          url = "https://mansaapi.com/api/v1/markets/exchanges/BSE/stocks?limit=200"
          req = urllib.request.Request(url, headers={
              'Authorization': f'Bearer {api_key}',
              'Accept': 'application/json',
              'User-Agent': 'Mozilla/5.0'
          })

          try:
              with urllib.request.urlopen(req) as response:
                  result = json.loads(response.read().decode('utf-8'))
                  stocks_data = result.get('data', [])
                  prices = {s.get('ticker'): s.get('price') for s in stocks_data if s.get('ticker') and s.get('price') is not None}
                  with open('prices.json', 'w') as f:
                      json.dump(prices, f, indent=2)
                  print(f"Updated {len(prices)} prices.")
          except Exception as e:
              print(f"Price Error: {e}")
          PY

      # 2. FETCH NEWS (Strict Blacklist + PDF check)
      - name: Scrape BSE News
        run: |
          pip install beautifulsoup4 requests
          python - <<'PY'
          import json
          import requests
          from bs4 import BeautifulSoup
          import re

          url = "https://www.bse.co.bw/xnews/"
          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}

          try:
              response = requests.get(url, headers=headers, timeout=15)
              soup = BeautifulSoup(response.text, 'html.parser')
              
              news_items = []
              
              # STRICT BLACKLIST: If the title contains any of these words, ignore it.
              blacklist = [
                  "skip to", "overview", "history", "mission", "vision", "values", 
                  "partners", "associations", "corporate social", "objectives", 
                  "areas of focus", "adopt a school", "graduate trainee", 
                  "contact", "privacy", "home", "about us", "market data", 
                  "listed companies", "investor relations", "media", "faqs"
              ]
              
              # Find all text nodes matching the BSE date format
              date_pattern = re.compile(r'\d{4}-\d{2}-\d{2} \d{2}:\d{2} [AP]M GMT\+2')
              date_elements = soup.find_all(string=date_pattern)

              for date_el in date_elements:
                  # Look closely at the parent element of this date
                  parent = date_el.parent
                  if not parent: continue
                  
                  # Find the <a> tag inside the same container as the date
                  link_tag = parent.find('a')
                  if not link_tag:
                      # Sometimes it's one level up
                      link_tag = parent.parent.find('a') if parent.parent else None
                      
                  if link_tag:
                      title = link_tag.get_text(" ", strip=True)
                      href = link_tag.get('href', '#')
                      
                      # Skip if title is too short
                      if len(title) < 10: continue
                      
                      # Skip if title is in the blacklist
                      is_junk = any(word in title.lower() for word in blacklist)
                      if is_junk: continue

                      # Make absolute URL
                      if href.startswith('/'):
                          href = "https://www.bse.co.bw" + href
                          
                      # Guess the ticker
                      ticker = "BSE"
                      upper_title = title.upper()
                      for sym in ["FNBB", "ABSA", "BTCL", "TURNSTAR", "SECHABA", "SEFALANA", "LETSHEGO", "CHOPPIES", "STANBIC", "BIHL", "NAP", "RDC", "ENGEN", "MINERGY", "BOTALA", "SHUMBA", "TLOU", "CHOBE", "CRESTA", "G4S", "LETLOLE", "PRIMETIME", "ACCESS"]:
                          if sym in upper_title:
                              ticker = sym
                              break
                              
                      # Clean date
                      date_str = date_el.strip()[:10]

                      news_items.append({
                          "symbol": ticker,
                          "title": title,
                          "link": href,
                          "date": date_str,
                          "summary": "Click to view the official BSE disclosure document."
                      })

              # Remove duplicates
              unique_news = list({v['title']:v for v in news_items}.values())

              if len(unique_news) > 0:
                  final_news = unique_news[:10]
                  with open('news.json', 'w') as f:
                      json.dump(final_news, f, indent=2)
                  print(f"Successfully scraped {len(final_news)} news items.")
                  for n in final_news:
                      print(f"- {n['date']} | {n['title']}")
              else:
                  print("CRITICAL: Found 0 valid news items. The site structure may have changed.")
                  
          except Exception as e:
              print(f"News Error: {e}")
          PY

      # 3. COMMIT CHANGES
      - name: Commit and Push
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email "action@github.com"
          git add prices.json news.json
          git commit -m "Update prices and news" || exit 0
          git pull --rebase origin main
          git push
