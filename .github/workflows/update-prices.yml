- name: Fetch Prices from Mansa API
  run: |
    python - <<'PY'
    import json
    import urllib.request
    import urllib.error
    import os

    api_key = os.environ.get('MANSA_API_KEY', '')
    if not api_key:
        print("ERROR: MANSA_API_KEY secret is empty or not passed to the script.")
        exit(1)
        
    print(f"Key loaded successfully. Length: {len(api_key)} characters.")

    # Using the exact correct endpoint from the Mansa docs
    url = "https://mansaapi.com/api/v1/markets/exchanges/BSE/stocks?limit=200"
    req = urllib.request.Request(url, headers={
        'Authorization': f'Bearer {api_key}',
        'Accept': 'application/json',
        'User-Agent': 'Mozilla/5.0'
    })

    try:
        with urllib.request.urlopen(req) as response:
            result = json.loads(response.read().decode('utf-8'))
            stocks_data = result.get('data', [])
            
            if not stocks_data:
                print("API returned success but 0 stocks found.")
                print(result) 
                exit(1)

            prices = {}
            for stock in stocks_data:
                ticker = stock.get('ticker')
                price = stock.get('price')
                if ticker and price is not None:
                    prices[ticker] = price

            with open('prices.json', 'w') as f:
                json.dump(prices, f, indent=2)
            print(f"Successfully updated {len(prices)} prices.")
    except urllib.error.HTTPError as e:
        print(f"HTTP Error: {e.code} - {e.reason}")
        # THIS WILL SHOW THE EXACT MESSAGE FROM MANSA API
        print(e.read().decode('utf-8')) 
        exit(1)
    except Exception as e:
        print(f"Other Error: {e}")
        exit(1)
    PY
  env:
    MANSA_API_KEY: ${{ secrets.MANSA_API_KEY }}
