<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSE Portfolio Tracker</title>
    
    <!-- Custom Web App Icons -->
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/512/line-chart.png">
    <link rel="icon" type="image/png" href="https://img.icons8.com/color/512/line-chart.png">

    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #00e676;
            --border-color: #333333;
            --input-bg: #2a2a2a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.5rem;
            margin: 0;
            color: var(--accent-color);
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        .card h2 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
        }

        input, select, button {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 1rem;
        }

        button {
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th, td {
            text-align: left;
            padding: 10px 6px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: #888;
        }

        .delete-btn {
            background-color: #ff5252;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>BSE Portfolio Tracker</h1>
    </div>

    <!-- Summary Widget View -->
    <div class="card">
        <h2>Portfolio Overview</h2>
        <div>Total Value: <strong id="total-val">P0.00</strong></div>
        <div style="margin-top: 6px;">Total Holdings: <span id="total-count">0</span> assets</div>
    </div>

    <!-- Add Asset Form -->
    <div class="card">
        <h2>Add Holding</h2>
        <div class="form-group">
            <input type="text" id="asset-search" list="bse-list" placeholder="Search Ticker or Name (e.g., ADBF, SHUMBA)...">
            <datalist id="bse-list"></datalist>
            
            <input type="number" id="asset-qty" placeholder="Shares / Units Quantity" step="any">
            <input type="number" id="asset-price" placeholder="Buy Price per Share (BWP / USD)" step="any">
            <button onclick="addHolding()">Add to Portfolio</button>
        </div>
    </div>

    <!-- Holdings Table -->
    <div class="card">
        <h2>Holdings</h2>
        <table>
            <thead>
                <tr>
                    <th>Ticker</th>
                    <th>Qty</th>
                    <th>Price</th>
                    <th>Value</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="holdings-list">
            </tbody>
        </table>
    </div>

    <script>
        // BSE Equities, ETFs, and Tracked Assets Dataset
        const bseAssets = [
            { symbol: "TURNSTAR", name: "Turnstar Holdings Limited", type: "Equity" },
            { symbol: "PRIMETIME", name: "PrimeTime Property Holdings", type: "Equity" },
            { symbol: "FNBB", name: "First National Bank Botswana", type: "Equity" },
            { symbol: "SEFALANA", name: "Sefalana Holding Company", type: "Equity" },
            { symbol: "SECHABA", name: "Sechaba Brewery Holdings", type: "Equity" },
            { symbol: "NAP", name: "New African Properties Limited", type: "Equity" },
            { symbol: "BIHL", name: "Botswana Insurance Holdings Ltd", type: "Equity" },
            { symbol: "CHOBE", name: "Chobe Holdings Limited", type: "Equity" },
            { symbol: "ENGEN", name: "Engen Botswana Limited", type: "Equity" },
            { symbol: "LUCARA", name: "Lucara Diamond Corp", type: "Equity" },
            { symbol: "ANGLO", name: "Anglo American Plc", type: "Equity" },
            { symbol: "SHUMBA", name: "Shumba Energy Limited", type: "Equity" },
            { symbol: "ADBF", name: "African Domestic Bond Fund ETF", type: "ETF" },
            { symbol: "NEWGOLD", name: "NewGold ETF", type: "ETF" },
            { symbol: "NEWPALL", name: "NewGold Palladium ETF", type: "ETF" },
            { symbol: "O", name: "Realty Income Corporation", type: "US REIT" }
        ];

        let holdings = JSON.parse(localStorage.getItem('bse_portfolio')) || [];

        function initDatalist() {
            const list = document.getElementById('bse-list');
            list.innerHTML = '';
            bseAssets.forEach(asset => {
                const opt = document.createElement('option');
                opt.value = asset.symbol;
                opt.label = `${asset.name} (${asset.type})`;
                list.appendChild(opt);
            });
        }

        function saveAndRender() {
            localStorage.setItem('bse_portfolio', JSON.stringify(holdings));
            const tbody = document.getElementById('holdings-list');
            tbody.innerHTML = '';

            let totalVal = 0;

            holdings.forEach((item, index) => {
                const itemVal = item.qty * item.price;
                totalVal += itemVal;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${item.symbol}</strong></td>
                    <td>${item.qty}</td>
                    <td>${item.price.toFixed(2)}</td>
                    <td>${itemVal.toFixed(2)}</td>
                    <td><button class="delete-btn" onclick="removeHolding(${index})">X</button></td>
                `;
                tbody.appendChild(row);
            });

            document.getElementById('total-val').innerText = 'P' + totalVal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('total-count').innerText = holdings.length;
        }

        function addHolding() {
            const symbolInput = document.getElementById('asset-search').value.trim().toUpperCase();
            const qtyInput = parseFloat(document.getElementById('asset-qty').value);
            const priceInput = parseFloat(document.getElementById('asset-price').value);

            if (!symbolInput || isNaN(qtyInput) || isNaN(priceInput)) {
                alert("Please fill in a valid ticker, quantity, and buy price.");
                return;
            }

            holdings.push({ symbol: symbolInput, qty: qtyInput, price: priceInput });
            document.getElementById('asset-search').value = '';
            document.getElementById('asset-qty').value = '';
            document.getElementById('asset-price').value = '';

            saveAndRender();
        }

        function removeHolding(index) {
            holdings.splice(index, 1);
            saveAndRender();
        }

        initDatalist();
        saveAndRender();
    </script>
</body>
</html>
